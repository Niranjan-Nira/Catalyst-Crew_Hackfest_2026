<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172235"/>
    </linearGradient>
    <linearGradient id="code" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="docs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="out" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8fa4bd"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 16px 'Segoe UI', sans-serif; fill: #aebbd0; }
      .section { font: 700 13px 'Segoe UI', sans-serif; fill: #8ea3bd; letter-spacing: 2px; }
      .folder { font: 700 19px 'Segoe UI', sans-serif; fill: #ffffff; }
      .file { font: 400 14px 'Segoe UI', sans-serif; fill: #dbe5f2; }
      .note { font: 400 12px 'Segoe UI', sans-serif; fill: #aebbd0; }
      .root { font: 700 22px 'Segoe UI', sans-serif; fill: #ffffff; }
      .box { stroke: #ffffff; stroke-opacity: 0.16; stroke-width: 1; rx: 14; filter: url(#shadow); }
      .line { stroke: #8fa4bd; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .branch { stroke: #526983; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="1800" height="1220" fill="url(#bg)"/>
  <circle cx="1660" cy="70" r="230" fill="#1e40af" opacity="0.12"/>
  <circle cx="120" cy="1130" r="260" fill="#0f766e" opacity="0.10"/>

  <text x="70" y="62" class="title">Hackfest 2026 | Repository Folder Map</text>
  <text x="70" y="92" class="subtitle">Where to add code, diagnostic evidence, documentation, generated results, and tests</text>

  <rect x="70" y="130" width="1660" height="82" class="box" fill="#334155"/>
  <text x="105" y="166" class="root">Hackfest-2026-main/</text>
  <text x="105" y="191" class="note">Keep runnable entry points and project configuration here. Do not place generated case files in the root.</text>

  <text x="70" y="252" class="section">APPLICATION CODE</text>
  <rect x="70" y="275" width="520" height="430" class="box" fill="url(#code)"/>
  <text x="102" y="314" class="folder">src/</text>
  <text x="102" y="338" class="note">Reusable implementation lives here.</text>
  <text x="112" y="376" class="file">config.py, utils.py</text>
  <text x="112" y="399" class="file">reddit_assistant.py</text>
  <text x="112" y="437" class="file">diagnosis/  - anomaly detectors and engine</text>
  <text x="112" y="463" class="file">parsers/   - CSV, event, WER, timeline readers</text>
  <text x="112" y="489" class="file">rag/       - chunk, index, retrieve knowledge</text>
  <text x="112" y="515" class="file">rca/       - correlation, agents, Luna solutions</text>
  <text x="112" y="541" class="file">reporting/ - scorecards, reports, PDF output</text>
  <text x="112" y="567" class="file">self_healing/ - remediation action generator</text>
  <text x="112" y="610" class="note">Add new product behavior under the closest src module.</text>
  <text x="112" y="630" class="note">Keep __init__.py files; ignore __pycache__/.</text>

  <rect x="625" y="275" width="520" height="210" class="box" fill="#0f766e"/>
  <text x="657" y="314" class="folder">Root Python files</text>
  <text x="657" y="351" class="file">app.py  - main application entry point</text>
  <text x="657" y="377" class="file">cli.py  - command-line entry point</text>
  <text x="657" y="403" class="file">requirements.txt  - runtime dependencies</text>
  <text x="657" y="429" class="file">Credentials.txt  - local credential notes; never commit secrets</text>
  <text x="657" y="461" class="note">Use Env/.env for local environment values.</text>

  <rect x="1180" y="275" width="550" height="210" class="box" fill="#365314"/>
  <text x="1212" y="314" class="folder">tests/</text>
  <text x="1212" y="351" class="file">test.py</text>
  <text x="1212" y="377" class="file">test_pipeline.py</text>
  <text x="1212" y="403" class="file">test_rag.py</text>
  <text x="1212" y="429" class="file">test_reddit_integration (Optional).py</text>
  <text x="1212" y="461" class="note">Add regression and integration coverage here.</text>

  <path d="M330 212 V245 H330 V275" class="line"/>
  <path d="M520 212 V245 H885 V275" class="line"/>
  <path d="M720 212 V245 H1455 V275" class="line"/>

  <text x="70" y="755" class="section">CASE INPUTS AND REFERENCE MATERIAL</text>
  <rect x="70" y="778" width="805" height="365" class="box" fill="url(#data)"/>
  <text x="102" y="817" class="folder">Input file/</text>
  <text x="102" y="843" class="note">Raw Windows diagnostic evidence. Add new case exports here.</text>
  <text x="112" y="881" class="file">_StatusReport/ - summary CSV, JSON, and TXT</text>
  <text x="112" y="907" class="file">01_Timeline_And_Resources/ - timelines and resource samples</text>
  <text x="112" y="933" class="file">02_EventLogs/ - exported Windows event logs</text>
  <text x="112" y="959" class="file">03_WindowsUpdates/ - hotfixes, history, pending updates</text>
  <text x="112" y="985" class="file">04_HardwareDevices/ - devices, drivers, GPU, problem devices</text>
  <text x="112" y="1011" class="file">05_Disk/  06_Memory/  07_CPU/  - health and performance evidence</text>
  <text x="112" y="1037" class="file">08_SystemInfo/ through 12_Network/ - system, reliability, battery, startup, network</text>
    <text x="112" y="1063" class="file">13_AppLogs/ through 16_Services_Processes/ - app, dump, and service evidence</text>
  <text x="112" y="1101" class="note">Keep the numbered folder names stable so parsers can locate evidence.</text>

  <rect x="920" y="778" width="380" height="365" class="box" fill="url(#docs)"/>
  <text x="952" y="817" class="folder">knowledge_docs/</text>
  <text x="952" y="855" class="file">Troubleshooting guides</text>
  <text x="952" y="881" class="file">Anomaly catalog and investigation guide</text>
  <text x="952" y="907" class="file">Dataset methodology and cheat sheets</text>
  <text x="952" y="933" class="file">RAG reference material</text>
  <text x="952" y="977" class="note">Add durable, human-reviewed knowledge here.</text>
  <text x="952" y="1003" class="note">The RAG pipeline indexes this folder.</text>

  <rect x="1345" y="778" width="385" height="365" class="box" fill="url(#out)"/>
  <text x="1377" y="817" class="folder">output/</text>
  <text x="1377" y="855" class="file">Case_Report_*.md / .pdf</text>
  <text x="1377" y="881" class="file">SIEM_Incident_*.json</text>
  <text x="1377" y="907" class="file">rag_cache/ - generated index/cache</text>
  <text x="1377" y="933" class="file">scripts/ - generated remediation scripts</text>
  <text x="1377" y="959" class="file">uploaded_cases/ - staged uploads</text>
  <text x="1377" y="1003" class="note">Generated case artifacts belong here.</text>
  <text x="1377" y="1029" class="note">Do not hand-edit unless documenting a result.</text>

  <path d="M330 212 V735 H470 V778" class="line"/>
  <path d="M885 212 V735 H1110 V778" class="line"/>
  <path d="M1455 212 V735 H1537 V778" class="line"/>

  <text x="70" y="1180" class="note">Optional integration: Reddit (Optional)/ contains Reddit assistant experiments. Sample data for Hack Fest/ contains reference/demo material.</text>
  <text x="70" y="1202" class="note">Color key: teal = application code | blue = diagnostic input | violet = knowledge | amber = generated output | green = tests</text>
</svg>
